<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body{ font-family:Arial, sans-serif; background:#FAF8F2; margin:0; padding:24px; color:#13161B; }
    h1{ font-size:22px; margin-bottom:4px; }
    .sub{ color:#5A6472; font-size:13px; margin-bottom:24px; }
    .card{
      background:#fff; border:1px solid #E1DCCE; border-radius:12px;
      padding:16px 18px; margin-bottom:14px;
    }
    .card h3{ margin:0 0 6px; font-size:16px; color:#0F2038; }
    .card .when{ font-family:monospace; color:#C4872F; font-size:13px; margin-bottom:10px; }
    .card pre{
      white-space:pre-wrap; background:#FAF8F2; border-radius:8px; padding:10px;
      font-size:13px; margin:0 0 10px; font-family:monospace;
    }
    button{
      background:#0F2038; color:#fff; border:none; padding:9px 16px;
      border-radius:8px; font-size:13px; cursor:pointer;
    }
    button:hover{ background:#17324F; }
    .empty{ color:#9B9584; font-size:14px; }
  </style>
</head>
<body>
  <h1>Nadchodzące rezerwacje</h1>
  <div class="sub">Kliknij "Kopiuj dla kierowcy", aby skopiować dane do wysłania (np. na WhatsApp).</div>

  <? if (events && events.length > 0) { ?>
    <? events.forEach(function(ev, i) { ?>
      <div class="card">
        <h3><?= ev.title ?></h3>
        <div class="when"><?= ev.start ?></div>
        <pre id="desc-<?= i ?>"><?= ev.description ?></pre>
        <button onclick="copyData(<?= i ?>)">Kopiuj dla kierowcy</button>
      </div>
    <? }); ?>
  <? } else { ?>
    <p class="empty">Brak zaplanowanych rezerwacji w najbliższych 60 dniach.</p>
  <? } ?>

  <script>
    function copyData(i) {
      const text = document.getElementById('desc-' + i).innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Skopiowano dane — możesz je wkleić w wiadomości do kierowcy.');
      });
    }
  </script>
</body>
</html>
