name: Auto-publikacja artykułów na blog (9 języków)

# Codziennie: naprawia brakujące/uszkodzone wersje językowe, a co 3 dni dodaje nowy artykuł
# (temat sprawdzany względem całej historii bloga — bez powtórek).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force_new:
        description: "Napisz nowy artykuł od razu (bez czekania 3 dni)"
        type: boolean
        default: false
      mock:
        description: "Test bez API (nic nie kosztuje, NIE publikuje)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pełna historia: sitemap bierze lastmod z daty ostatniego commita pliku

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Naprawa + nowy artykuł (9 języków)
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
          BLOG_FORCE_NEW: ${{ inputs.force_new && '1' || '0' }}
          BLOG_MOCK: ${{ inputs.mock && '1' || '0' }}
        run: node auto-blog/generate-article.mjs

      - name: Linkowanie wewnętrzne (artykuły ↔ podstrony tras)
        if: always() && !inputs.mock
        run: python3 auto-blog/link-routes.py && python3 auto-blog/build-routes.py

      - name: Sitemap
        if: always()
        run: node auto-blog/build-sitemap.mjs

      - name: Kontrola SEO (canonical, hreflang, H1, title, description, JSON-LD)
        if: always()
        run: python3 auto-blog/seo_check.py || echo "::warning::seo_check.py zgłosił problemy — szczegóły w logu"

      - name: Zapisz zmiany w repozytorium
        if: always() && !inputs.mock
        run: |
          git config user.name "xtrip-bot"
          git config user.email "bot@xtrip.local"
          git add -A
          git diff --cached --quiet && { echo "Brak zmian"; exit 0; }
          git commit -m "Auto: blog $(date -u +%F)"
          git push
